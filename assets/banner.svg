<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Tamer Tamer, Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="0.55" stop-color="#0D1530"/>
      <stop offset="1" stop-color="#1A1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.1" r="0.4">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="rightFade"><rect width="1200" height="320" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .t{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .trace{fill:none;stroke:#8B9CF7;stroke-opacity:.22;stroke-width:1.5}
    .pulse{fill:none;stroke:url(#accent);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:28 600;animation:run 6s linear infinite}
    .node{fill:#0D1530;stroke:#8B9CF7;stroke-opacity:.55;stroke-width:1.5}
    .live{fill:#5EEAD4;animation:blink 2.4s ease-in-out infinite}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes run{from{stroke-dashoffset:628}to{stroke-dashoffset:0}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
  </style>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <g mask="url(#rightFade)">
    <path class="trace" d="M 760 40 H 860 V 110 H 990 V 60 H 1160"/>
    <path class="trace" d="M 720 160 H 820 V 200 H 940 V 150 H 1060 V 230 H 1180"/>
    <path class="trace" d="M 780 280 H 900 V 250 H 1010 V 290 H 1140"/>
    <path class="trace" d="M 860 110 V 200"/>
    <path class="trace" d="M 990 60 V 150"/>
    <path class="trace" d="M 1060 230 V 290"/>
    <path class="trace" d="M 900 250 V 200"/>
    <path class="pulse" d="M 760 40 H 860 V 110 H 990 V 60 H 1160" style="animation-delay:0.0s"/>
    <path class="pulse" d="M 720 160 H 820 V 200 H 940 V 150 H 1060 V 230 H 1180" style="animation-delay:1.7s"/>
    <path class="pulse" d="M 780 280 H 900 V 250 H 1010 V 290 H 1140" style="animation-delay:3.4s"/>
    <circle class="node" cx="860" cy="110" r="5"/>
    <circle class="node" cx="990" cy="60" r="5"/>
    <circle class="node" cx="820" cy="200" r="5"/>
    <circle class="node" cx="940" cy="150" r="5"/>
    <circle class="node" cx="1060" cy="230" r="5"/>
    <circle class="node" cx="900" cy="250" r="5"/>
    <circle class="node" cx="1010" cy="290" r="5"/>
    <circle class="node" cx="990" cy="150" r="5"/>
    <circle class="node" cx="1060" cy="150" r="5"/>
    <circle class="node" cx="940" cy="200" r="5"/>
    <circle class="node" cx="1160" cy="60" r="5"/>
    <circle class="node" cx="1180" cy="230" r="5"/>
    <circle class="node" cx="1140" cy="290" r="5"/>
    <circle class="live" cx="990" cy="150" r="2.6" style="animation-delay:0.0s"/>
    <circle class="live" cx="860" cy="110" r="2.6" style="animation-delay:0.8s"/>
    <circle class="live" cx="1060" cy="230" r="2.6" style="animation-delay:1.6s"/>
  </g>
  <g transform="translate(64,0)">
    <rect x="0" y="62" width="44" height="4" rx="2" fill="url(#accent)"/>
    <text class="t" x="0" y="140" font-size="64" font-weight="700" fill="#F5F7FF" letter-spacing="-1">Tamer Tamer</text>
    <text class="t" x="2" y="184" font-size="24" font-weight="500" fill="#C9D1F5">Software Engineer  ·  Cloud, APIs &amp; AI Agents</text>
    <g class="m" font-size="17">
      <text x="2" y="244" fill="#5EEAD4">~</text>
      <text x="20" y="244" fill="#8B9CF7">$</text>
      <text x="38" y="244" fill="#AAB4DA">whoami --short</text>
      <text x="2" y="272" fill="#E7EAF8">Computer Engineering @ UCSB  ·  building on AWS  ·  San Diego, CA<tspan class="cursor" fill="#5EEAD4"> ▍</tspan></text>
    </g>
  </g>
</svg>
