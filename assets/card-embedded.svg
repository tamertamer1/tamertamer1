<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Embedded C on ARM">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1124"/><stop offset="1" stop-color="#15123A"/></linearGradient>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs>
<style>.t{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}</style>
<rect x=".75" y=".75" width="578.5" height="198.5" rx="16" fill="url(#g)" stroke="#8B9CF7" stroke-opacity=".28" stroke-width="1.5"/>
<rect x="28" y="24" width="32" height="3" rx="1.5" fill="url(#a)"/>
<text class="t" x="28" y="60" font-size="23" font-weight="700" fill="#F5F7FF">Embedded C on ARM</text>
<text class="t" x="28" y="80" font-size="13.5" font-weight="500" fill="#A78BFA">STM32 bare-metal drivers</text>
