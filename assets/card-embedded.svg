<text class="m" x="514.0" y="56.5" text-anchor="middle" font-size="12" fill="#C9B8FF">Firmware</text>
<text class="t" x="28" y="104" font-size="14.5" fill="#B7C0E6">Register-level drivers for clocks, timers, interrupts, UART,</text><text class="t" x="28" y="125" font-size="14.5" fill="#B7C0E6">SPI and I2C, plus an accelerometer interface.</text>
