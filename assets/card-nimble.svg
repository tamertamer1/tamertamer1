<text class="t" x="28" y="104" font-size="14.5" fill="#B7C0E6">Server streams H.264 video; the browser detects the ball and</text><text class="t" x="28" y="125" font-size="14.5" fill="#B7C0E6">reports back over QUIC for live error scoring.</text>
